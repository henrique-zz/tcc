# ============================================================
# CONFIGURAÇÕES DO EXPERIMENTO
# ============================================================

# --- Parâmetros do Dataset ---
dataset:
  nome: "corsican"               
  pasta_imagens: "corsican-dataset"  
  pasta_saida: "bdfire_yolo"     
  train_size: 0.80
  val_size: 0.10
  test_size: 0.10

# --- Parâmetros de Processamento (Visão Computacional) ---
processamento:
  kernel_size: 11
  merge_margin: 60
  min_area_pct: 0.0001

# --- Parâmetros do YOLOv8 ---
treinamento:
  modelo_base: "yolov8n.pt"      
  epochs: 100                    
  imgsz: 640                     
  batch_size: 16
  nome_experimento: "corsican-yolov8n"
  device: 0
  workers: 0