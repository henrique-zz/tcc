# Aqui que alteramos o modelo usado, e em nome_experimento é o diretório que vai ficar salvo na pasta runs
treinamento:
  modelo_base: "pesos/yolov8n.pt"      
  epochs: 100                    
  imgsz: 640                     
  batch_size: 16
  nome_experimento: "flamevision-yolov8n-run07"
  device: 0
  workers: 0