# --- Parâmetros do Dataset ---
dataset:
  nome: "flamevision"               
  pasta_imagens: "datasets/flamevision-dataset"  
  pasta_saida: "datasets/flamevision-dataset/Detection" # Onde o modelo vai achar o dataset.yaml     
  train_size: 0.80
  val_size: 0.10
  test_size: 0.10

# --- Parâmetros de Processamento (Visão Computacional) ---
# processamento:
#   kernel_size: 11
#   merge_margin: 60
